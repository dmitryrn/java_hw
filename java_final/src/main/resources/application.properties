spring.application.name=media-portal

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/media_portal}
spring.datasource.username=${DB_USERNAME:media_user}
spring.datasource.password=${DB_PASSWORD:media_password}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.cache.type=redis

app.jwt.secret=${JWT_SECRET:bWVkaWEtcG9ydGFsLWRldmVsb3BtZW50LXNlY3JldC1rZXktMzJieXRlcw==}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
