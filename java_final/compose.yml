services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_DB: media_portal
      POSTGRES_USER: media_user
      POSTGRES_PASSWORD: media_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:8.8.3
    ports:
      - "6379:6379"

volumes:
  postgres_data:
