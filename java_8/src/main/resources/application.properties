spring.application.name=java_8

# Server
server.port=8080
server.servlet.context-path=/api

# Default local database: H2 in-memory. Use the postgres profile for PostgreSQL.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Let Hibernate create/update the schema from the JPA entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.example.java_8=DEBUG
